<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio - Working Buttons</title>
  <link rel="stylesheet" href="style.css"/>

  <!-- Optional: per-user JSON config (can be overridden by URL params) -->
  <script id="portfolio-config" type="application/json">
  {
    "profile": {
      "name": "James Liu",
      "title": "AI Engineer",
      "description": "Deep learning with PyTorch and TensorFlow. Computer vision, NLP, and MLOps. Research background in neural networks.",
      "email": "james.liu@example.com"
    },
    "links": {
      "projects": "https://your-projects-site.example.com",
      "contact": "mailto:james.liu@example.com"
    }
  }
  </script>

  <style>
    /* Ensure buttons/links are clickable above decorative layers */
    .button-group { position: relative; z-index: 10; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Portfolio Header -->
    <div class="portfolio-header">
      <h1 class="profile-name" data-config="profile.name">James Liu</h1>
      <h2 class="profile-title" data-config="profile.title">AI Engineer</h2>
      <p class="profile-description" data-config="profile.description">
        Deep learning with PyTorch and TensorFlow. Computer vision, NLP, and MLOps. Research background in neural networks.
      </p>

      <div class="button-group">
        <!-- Real external links (script.js will set hrefs dynamically) -->
        <a class="btn btn-primary" id="projectsLink" href="#" target="_blank" rel="noopener noreferrer">
          📁 View Projects
        </a>
        <a class="btn btn-secondary" id="contactLink" href="#">
          📧 Get in Touch
        </a>
      </div>
    </div>
  </div>

  <!-- Projects Modal -->
  <div id="projectsModal" class="modal" role="dialog" aria-labelledby="projectsTitle" aria-hidden="true">
    <div class="modal-content">
      <button class="close" type="button" aria-label="Close modal">&times;</button>
      <h2 id="projectsTitle">Featured Projects</h2>
      <div class="projects-grid" id="projectsGrid">
        <!-- Default projects will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Contact Modal -->
  <div id="contactModal" class="modal" role="dialog" aria-labelledby="contactTitle" aria-hidden="true">
    <div class="modal-content">
      <button class="close" type="button" aria-label="Close modal">&times;</button>
      <h2 id="contactTitle">Get in Touch</h2>
      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="contactName">Your Name</label>
          <input type="text" id="contactName" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="contactEmail">Your Email</label>
          <input type="email" id="contactEmail" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" name="message" rows="5" placeholder="Your message..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </div>

  <!-- Root-relative path helps avoid 404s on deploy -->
  <!-- If script.js is next to this HTML file -->
<script src="./script.js" defer></script>

</body>
</html>
